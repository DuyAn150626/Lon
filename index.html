<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trung Thu 3D - Gửi Nguyện Ước</title>
    <!-- Nhúng Font FontAwesome để hiển thị icon nhạc -->
        <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #060312;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* Thanh hướng dẫn phía dưới */
        .bottom-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            pointer-events: none;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        /* Nút bật/tắt nhạc góc trên */
        #audio-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            color: #ffd700;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        #audio-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }
        /* Bảng Modal hiển thị lời chúc chuẩn giao diện video */
        .wish-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(3px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .wish-modal.active {
            opacity: 1;
            pointer-events: auto;
        }
        .wish-card {
            background: linear-gradient(135deg, #2a103d 0%, #150824 100%);
            border: 2px solid #ffd700;
            border-radius: 15px;
            width: 90%;
            max-width: 420px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7), 0 0 20px rgba(255, 215, 0, 0.2);
            position: relative;
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }
        .wish-modal.active .wish-card {
            transform: scale(1);
        }
        .close-btn {
            position: absolute;
            top: 12px;
            right: 15px;
            color: #ffd700;
            font-size: 22px;
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        .close-btn:hover {
            opacity: 1;
        }
        .card-title {
            color: #ffd700;
            font-size: 20px;
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: 1px;
        }
                /* ĐOẠN CSS MỚI: TỰ ĐỘNG THÍCH ỨNG THEO TỶ LỆ ẢNH GỐC */
        .image-container {
            width: 100%;
            max-height: 250px; /* Giới hạn chiều cao tối đa để bảng không bị quá dài */
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            background: #0f071a;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-container img {
            width: 100%;
            height: auto; /* Giúp ảnh tự co giãn theo chiều dọc mà không bị méo */
            max-height: 250px;
            object-fit: contain; /* Giữ nguyên tỷ lệ gốc của ảnh, không bị cắt hay bóp méo */
        }

        }
               /* TỰ THÊM ĐOẠN NÀY ĐỂ ÉP CHỮ CHUYỂN SANG MÀU TRẮNG SÁNG */
        #wishText {
            color: #ffffff !important; 
            font-size: 16px;
            line-height: 1.6;
            font-style: italic;
            padding: 10px 10px 0 10px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
        }

    </style>
</head>
<body>

    <div id="webgl-container"></div>
    
    <button id="audio-btn"><i class="fas fa-music" style="opacity:0.5;"></i></button>
    <div class="bottom-bar">Chạm vào lồng đèn để xem câu chúc Trung Thu</div>

    <!-- Cấu trúc Modal Lời Chúc -->
    <div id="wishModal" class="wish-modal">
        <div class="wish-card">
            <div id="closeWishBtn" class="close-btn">&times;</div>
            <div class="card-title">Gửi Người Thương</div>
            <div class="image-container">
                <img id="wishImage" src="" alt="Hình ảnh Trung Thu">
            </div>
            <div id="wishText"></div>
        </div>
    </div>

           <!-- Nhúng đúng đường dẫn đến nơi chứa file trên GitHub của bạn -->
    <script src="./tthu3d/assets/three.min.js"></script>
    <script src="./tthu3d/assets/OrbitControls.js"></script>
    <script src="./tthu3d/assets/script.js"></script>

    <!-- Thẻ âm thanh nền trỏ vào thư mục assets -->
    <audio id="bgm" src="./tthu3d/assets/1.mp3" loop prefetch></audio>


</body>
</html>
